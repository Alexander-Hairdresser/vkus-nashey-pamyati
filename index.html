<!doctype html><html lang="ru" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Вкус нашей памяти</title><link rel="stylesheet" href="./bundle.css"></head><body><div id="root"></div><script>const originalFetch=window.fetch.bind(window);window.fetch=async function(url,options={}){if(typeof url==='string'&&url==='/api/phrases'){try{let entries=JSON.parse(localStorage.getItem('memory-offline-phrases')||'[]');if(options.method==='POST'){let v=JSON.parse(options.body);entries.unshift({id:Date.now(),phrase:v.phrase,context:v.context,signature:v.signature,status:'NEW',createdAt:new Date().toISOString()});localStorage.setItem('memory-offline-phrases',JSON.stringify(entries));}return new Response(JSON.stringify({entries}),{status:200,headers:{'Content-Type':'application/json'}});}catch(e){return new Response('{}',{status:500});}}return originalFetch(url,options);};</script><script src="./bundle.js"></script></body></html>
